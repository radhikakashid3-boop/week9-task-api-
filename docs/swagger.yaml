openapi: 3.0.3
info:
  title: Task Management REST API
  version: 1.0.0
  description: Flask REST API with JWT authentication and task CRUD.
servers:
  - url: http://127.0.0.1:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Register:
      type: object
      required: [username, email, password]
      properties:
        username: {type: string}
        email: {type: string}
        password: {type: string}
    Task:
      type: object
      required: [title]
      properties:
        title: {type: string}
        description: {type: string}
        status: {type: string, enum: [pending, in_progress, completed]}
        priority: {type: string, enum: [low, medium, high]}
        category: {type: string}
        due_date: {type: string, format: date}
paths:
  /api/auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Register'}
      responses:
        '201': {description: Created}
  /api/auth/login:
    post:
      summary: Login
      responses:
        '200': {description: Success}
  /api/auth/refresh:
    post:
      summary: Refresh JWT access token
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Success}
  /api/tasks:
    get:
      summary: List tasks with filtering, sorting and pagination
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Success}
    post:
      summary: Create task
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Created}
  /api/tasks/{id}:
    get:
      summary: Get task
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Success}
    put:
      summary: Update task
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Success}
    delete:
      summary: Delete task
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Success}
